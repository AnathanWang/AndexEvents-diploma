version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  postgres:
    image: postgis/postgis:16-3.4
    container_name: andexevents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: andexevents
      POSTGRES_PASSWORD: andexevents_dev_password
      POSTGRES_DB: andexevents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andexevents -d andexevents"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - andexevents-network

  minio:
    image: minio/minio:latest
    container_name: andexevents-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: andexevents
      MINIO_ROOT_PASSWORD: andexevents_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - andexevents-network

  minio-init:
    image: minio/mc:latest
    container_name: andexevents-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 andexevents andexevents_minio_secret;

      mc mb --ignore-existing local/avatars;
      mc mb --ignore-existing local/events;
      mc mb --ignore-existing local/media;

      mc anonymous set download local/avatars;
      mc anonymous set download local/events;

      echo 'MinIO buckets created and configured!';
      "
    networks:
      - andexevents-network

  redis:
    image: redis:7-alpine
    container_name: andexevents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - andexevents-network

  # ============================================
  # API GATEWAY (Traefik)
  # ============================================

  traefik:
    image: traefik:latest
    container_name: andexevents-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - andexevents-network

  # ============================================
  # JAVA SERVICES (behind Traefik)
  # ============================================

  users-service-java:
    build:
      context: ../../services-java
      dockerfile: users-service/Dockerfile
    container_name: andexevents-users-service-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/andexevents
      SPRING_DATASOURCE_USERNAME: andexevents
      SPRING_DATASOURCE_PASSWORD: andexevents_dev_password
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-andexevents}
      FIREBASE_JWKS_URL: ${FIREBASE_JWKS_URL:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    ports:
      - "8081:8081"
    networks:
      - andexevents-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users-java.rule=PathPrefix(`/api/users`)"
      - "traefik.http.services.users-java.loadbalancer.server.port=8081"

  events-service-java:
    build:
      context: ../../services-java
      dockerfile: events-service/Dockerfile
    container_name: andexevents-events-service-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/andexevents
      SPRING_DATASOURCE_USERNAME: andexevents
      SPRING_DATASOURCE_PASSWORD: andexevents_dev_password
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-andexevents}
      FIREBASE_JWKS_URL: ${FIREBASE_JWKS_URL:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    ports:
      - "8082:8082"
    networks:
      - andexevents-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.events-java.rule=PathPrefix(`/api/events`)"
      - "traefik.http.services.events-java.loadbalancer.server.port=8082"

  auth-service-java:
    build:
      context: ../../services-java
      dockerfile: auth-service/Dockerfile
    container_name: andexevents-auth-service-java
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/andexevents
      SPRING_DATASOURCE_USERNAME: andexevents
      SPRING_DATASOURCE_PASSWORD: andexevents_dev_password
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-andexevents}
      FIREBASE_JWKS_URL: ${FIREBASE_JWKS_URL:-}
    ports:
      - "8083:8083"
    networks:
      - andexevents-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-java.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.services.auth-java.loadbalancer.server.port=8083"

  # ============================================
  # GO SERVICES (behind Traefik)
  # ============================================

  match-service:
    build:
      context: ../..
      dockerfile: services/match-service/Dockerfile
    container_name: andexevents-match-service
    restart: unless-stopped
    environment:
      PORT: "8005"
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: andexevents
      DB_PASSWORD: andexevents_dev_password
      DB_NAME: andexevents
      DB_SSL_MODE: disable
      FIREBASE_CREDENTIALS_FILE: /app/firebase-credentials.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../secrets/firebase-service-account.json:/app/firebase-credentials.json:ro
    networks:
      - andexevents-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matches.rule=PathPrefix(`/api/matches`)"
      - "traefik.http.services.matches.loadbalancer.server.port=8005"

  upload-service:
    build:
      context: ../..
      dockerfile: services/upload-service/Dockerfile
    container_name: andexevents-upload-service
    restart: unless-stopped
    environment:
      PORT: "8006"
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: andexevents
      DB_PASSWORD: andexevents_dev_password
      DB_NAME: andexevents
      DB_SSL_MODE: disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: andexevents
      MINIO_SECRET_KEY: andexevents_minio_secret
      MINIO_USE_SSL: "0"
      FIREBASE_CREDENTIALS_FILE: /app/firebase-credentials.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Public base URL for generated links (optional)
      UPLOADS_PUBLIC_BASE_URL: ${UPLOADS_PUBLIC_BASE_URL:-http://localhost}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../secrets/firebase-service-account.json:/app/firebase-credentials.json:ro
    networks:
      - andexevents-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upload.rule=PathPrefix(`/api/upload`) || PathPrefix(`/uploads`)"
      - "traefik.http.services.upload.loadbalancer.server.port=8006"

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  andexevents-network:
    driver: bridge
