server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring:
  application:
    name: events-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/andexevents}
    username: ${SPRING_DATASOURCE_USERNAME:andexevents}
    password: ${SPRING_DATASOURCE_PASSWORD:andexevents_dev_password}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: events
    schemas: events
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: events

app:
  auth:
    firebaseProjectId: ${FIREBASE_PROJECT_ID:}
    firebaseJwksUrl: ${FIREBASE_JWKS_URL:}
    defaultRequireAuth: ${APP_AUTH_DEFAULTREQUIREAUTH:false}
    requiredPaths:
      - method: POST
        pattern: /api/events
      - method: PUT
        pattern: /api/events/*
      - method: DELETE
        pattern: /api/events/*
      - method: POST
        pattern: /api/events/*/participate
      - method: DELETE
        pattern: /api/events/*/participate
      - method: GET
        pattern: /api/events/moderation/all
      - method: GET
        pattern: /api/events/*/sanctions
      - method: POST
        pattern: /api/events/*/sanctions
      - method: PUT
        pattern: /api/events/sanctions/*/revoke
      - method: GET
        pattern: /api/events/*/participants/manage
      - method: DELETE
        pattern: /api/events/*/participants/*
      - method: GET
        pattern: /api/events/*/bans
      - method: POST
        pattern: /api/events/*/bans
      - method: DELETE
        pattern: /api/events/*/bans/*
      - method: GET
        pattern: /api/events/*/waitlist
      - method: PUT
        pattern: /api/events/*/waitlist/*/approve
      - method: PUT
        pattern: /api/events/*/waitlist/*/reject
      - method: PUT
        pattern: /api/events/*/checkin/*
      - method: POST
        pattern: /api/events/organizer/blocks
      - method: GET
        pattern: /api/events/organizer/blocks
      - method: DELETE
        pattern: /api/events/organizer/blocks/*
      - method: POST
        pattern: /api/events/*/rating
      - method: GET
        pattern: /api/events/*/rating/reviews
    optionalPaths:
      - method: GET
        pattern: /api/events
      - method: GET
        pattern: /api/events/*
      - method: GET
        pattern: /api/events/*/rating/stats

  cors:
    allowedOriginPatterns: ${APP_CORS_ALLOWEDORIGINPATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
