server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring:
  application:
    name: users-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/andexevents}
    username: ${SPRING_DATASOURCE_USERNAME:andexevents}
    password: ${SPRING_DATASOURCE_PASSWORD:andexevents_dev_password}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: users
    schemas: users
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: users

app:
  auth:
    firebaseProjectId: ${FIREBASE_PROJECT_ID:}
    firebaseJwksUrl: ${FIREBASE_JWKS_URL:}
    requiredPaths:
      - method: POST
        pattern: /api/users
      - method: GET
        pattern: /api/users
      - method: PUT
        pattern: /api/users/*/role
      - method: GET
        pattern: /api/users/admin/audit-logs
      - method: GET
        pattern: /api/users/me
      - method: POST
        pattern: /api/users/me/onboarding
      - method: PUT
        pattern: /api/users/me
      - method: PUT
        pattern: /api/users/me/location
      - method: GET
        pattern: /api/users/matches
      - method: GET
        pattern: /api/users/reports
      - method: GET
        pattern: /api/users/reports/events
      - method: POST
        pattern: /api/users/reports
      - method: PUT
        pattern: /api/users/reports/*

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
